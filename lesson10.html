<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英語長文読解 本科 第10回 音読音声</title>
<style>
  body{font-family:-apple-system,"Hiragino Sans",sans-serif;margin:0;background:#f5f5f7;color:#1d1d1f;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
  .card{background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08);padding:32px 24px;max-width:420px;width:100%;text-align:center}
  h1{font-size:18px;margin:0 0 4px}
  .sub{font-size:13px;color:#86868b;margin:0 0 24px}
  audio{width:100%}
  .speed{margin-top:18px}
  .speed-label{font-size:12px;color:#86868b;margin-bottom:8px}
  .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .btns button{font-size:15px;padding:8px 14px;border:1px solid #d2d2d7;border-radius:10px;background:#fff;color:#1d1d1f;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .btns button.active{background:#0071e3;border-color:#0071e3;color:#fff;font-weight:600}
  .tip{font-size:12px;color:#86868b;margin-top:20px;line-height:1.6}
</style>
</head>
<body>
  <div class="card">
    <h1>英語長文読解 本科 第10回</h1>
    <p class="sub">「もし〜なら…のはず」― 仮定法で反論を読む／not A but B で主張をつかむ</p>
    <audio id="player" controls preload="metadata" src="lesson10.m4a"></audio>
    <div class="speed">
      <div class="speed-label">再生スピード</div>
      <div class="btns">
        <button data-rate="0.75">0.75x</button>
        <button data-rate="1" class="active">1.0x</button>
        <button data-rate="1.25">1.25x</button>
        <button data-rate="1.5">1.5x</button>
      </div>
    </div>
    <p class="tip">▶ を押すと英文の朗読が流れます。<br>慣れるまではゆっくり、慣れたら速めて練習しよう。</p>
  </div>
  <script>
    var player=document.getElementById('player');
    var btns=document.querySelectorAll('.btns button');
    btns.forEach(function(b){
      b.addEventListener('click',function(){
        player.playbackRate=parseFloat(b.dataset.rate);
        btns.forEach(function(x){x.classList.remove('active')});
        b.classList.add('active');
      });
    });
  </script>
</body>
</html>
